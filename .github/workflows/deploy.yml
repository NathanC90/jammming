name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skipped until the Spotify client ID is set as a repository variable (see README).
    if: vars.VITE_SPOTIFY_CLIENT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fail the deploy on a broken check, not after it's live.
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          # A client ID is public by design under PKCE; there is no client secret.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
